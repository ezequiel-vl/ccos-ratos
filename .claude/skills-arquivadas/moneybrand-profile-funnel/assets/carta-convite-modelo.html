<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITULO_PAGINA}}</title>
<style>
  :root { --tinta:#000; --papel:#fff; --cinza:#6b6b6b; --linha:#e2e2e2; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--papel); color:var(--tinta); font-family:"Lora", Georgia, "Times New Roman", serif; }
  .carta { max-width:600px; margin:0 auto; padding:64px 28px 72px; }
  .para { font-family:"Liberation Sans", Arial, Helvetica, sans-serif; font-size:14px; color:var(--cinza); margin:0 0 18px; line-height:1.5; }
  h1 { font-size:29px; line-height:1.3; margin:0 0 40px; font-weight:700; }
  h2 { font-size:20px; line-height:1.4; margin:44px 0 16px; font-weight:700; }
  p { font-size:18px; line-height:1.75; margin:0 0 18px; }
  ul, ol { font-size:18px; line-height:1.75; margin:0 0 22px; padding-left:24px; }
  li { margin-bottom:8px; }
  li span { display:block; color:#333; }
  .provas { font-family:"Liberation Sans", Arial, sans-serif; font-size:14px; color:var(--cinza); border:1px dashed #bdbdbd; padding:14px 16px; margin:32px 0; line-height:1.5; }
  .chamada { display:inline-block; margin:18px 0 36px; padding:14px 22px; background:var(--tinta); color:var(--papel); text-decoration:none; font-family:"Liberation Sans", Arial, sans-serif; font-size:16px; border-radius:4px; }
  .assina { font-size:18px; margin:0; }
  hr { border:0; border-top:1px solid var(--linha); margin:0 0 40px; }
  @media (max-width:480px){ .carta{ padding:40px 20px 56px; } h1{ font-size:24px; } p, ul, ol{ font-size:17px; } }
</style>
</head>
<body>
<main class="carta">
  <p class="para">{{PRE_HEADLINE}}</p>
  <h1>{{HEADLINE}}</h1>
  <hr>
{{CORPO}}
  <a class="chamada" href="{{CHAMADA_LINK}}">{{CHAMADA_BOTAO}}</a>
  <p class="assina">{{ASSINATURA}}</p>
</main>
</body>
</html>
