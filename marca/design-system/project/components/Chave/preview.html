<!-- @dsCard group="Ações" height=120 subtitle="clique pra ligar" -->
<div class="eze-chao" style="padding:28px">
  <div style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px;border-radius:var(--radius-card);border:1px solid var(--line);background:var(--sunk);max-width:520px">
    <div><div style="font:600 15px/1.3 var(--font-ui);color:var(--ink)">Manutenção do Ponto</div><div class="body-sm" style="color:var(--mute)">A partir de R$ 150 por mês.</div></div>
    <button type="button" class="eze-chave" id="ch" aria-pressed="false" aria-label="Incluir Manutenção do Ponto"></button>
  </div>
</div>
<script>
  var ch = document.getElementById('ch');
  ch.addEventListener('click', function () { ch.setAttribute('aria-pressed', ch.getAttribute('aria-pressed') === 'true' ? 'false' : 'true'); });
</script>
