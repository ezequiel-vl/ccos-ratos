<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>og ezeOS</title>
<!-- Fonte do ezeOS/site/assets/og.png (1200x630). Renderizar com Chromium headless e salvar como og.png. Sem grão, pra ficar leve no WhatsApp. -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:radial-gradient(70% 70% at 30% 0%, rgba(210,210,210,.09), transparent 72%) no-repeat, #0A0A0A; color:#F4F4F4; position:relative}
  img{position:absolute; left:80px; top:74px; height:42px}
  h1{position:absolute; left:80px; top:198px; font:700 92px/.96 "Archivo"; font-stretch:106%; letter-spacing:-.04em}
  .pt{color:#48A0C7}
  .rod{position:absolute; left:80px; right:80px; bottom:74px; display:flex; justify-content:space-between; align-items:center; font:500 18px/1 "JetBrains Mono"; letter-spacing:.14em; text-transform:uppercase}
  .end{color:#A6A6A6}
  .st{display:flex; align-items:center; gap:12px; color:#F4F4F4}
  .st i{width:12px; height:12px; border-radius:50%; background:#48A0C7; box-shadow:0 0 0 5px rgba(72,160,199,.18)}
</style></head>
<body>
  <img src="logo-branco.png" alt="ezeOS">
  <h1>A gente instala<br>a sua empresa<br>no digital<span class="pt">.</span></h1>
  <div class="rod"><span class="end">ezeos.com.br</span><span class="st"><i></i>no ar</span></div>
</body></html>
