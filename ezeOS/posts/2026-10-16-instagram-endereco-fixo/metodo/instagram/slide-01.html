<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>01</title>
<link rel="stylesheet" href="../../_base/slides.css">
<style>
  .miolo{justify-content:flex-start; padding-top:96px}
  .capa-trilho{position:absolute; left:88px; right:88px; bottom:150px; display:grid; grid-template-columns:repeat(3,1fr); gap:0}
  .elo{display:grid; gap:18px; padding:30px 28px; border:1px solid var(--line-2); border-radius:18px; background:var(--surface); margin-right:-1px}
  .elo .rotulo{font-size:22px; color:var(--mute)}
  .elo b{font:600 46px/1 var(--display); font-stretch:106%; letter-spacing:-.035em}
  .liga{position:absolute; top:50%; height:2px; background:rgba(255,255,255,.3); transform-origin:left}
</style></head>
<body data-duracao="7000"><div class="slide">
  <div class="topo"><img class="fade" src="../../_base/assets/logo-branco.png" alt="ezeOS"><span class="handle fade" style="--d:100">@agenciaezeos</span></div>
  <div class="miolo">

    <span class="rotulo in" style="--d:150; margin-bottom:34px">O método</span>
    <h1 class="hero" data-palavras="250" data-passo="140" style="margin-bottom:40px">Endereço Fixo<span class="pt">.</span></h1>
    <p class="lead in" style="--d:700; max-width:860px">As três etapas que instalam a sua empresa no digital, na ordem em que elas funcionam.</p>
    <div class="capa-trilho">
      <div class="elo card luz luz--anda sobe" style="--d:1300"><span class="rotulo">01</span><b>Ponto</b></div>
      <div class="elo card sobe" style="--d:1700"><span class="rotulo">02</span><b>Movimento</b></div>
      <div class="elo card sobe" style="--d:2100"><span class="rotulo">03</span><b>Atendimento</b></div>
    </div>
  </div>
  
</div>
<script src="../../_base/slides.js"></script>
</body></html>
