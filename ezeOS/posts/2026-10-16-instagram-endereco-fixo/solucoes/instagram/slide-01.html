<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>01</title>
<link rel="stylesheet" href="../../_base/slides.css">
<style>
  .miolo{justify-content:flex-start; padding-top:72px; gap:30px}
  .frase{font-size:84px}
  .pred{position:absolute; left:50%; bottom:110px; width:560px; margin-left:-280px; display:grid; gap:10px}
  .pred .bl{height:120px; border-radius:14px; border:1px solid var(--line-2); background:var(--surface); display:grid; grid-template-columns:repeat(4,1fr); gap:18px; padding:26px 30px}
  .pred .bl i{border-radius:6px; background:var(--skel)}
  .pred .chao{height:120px; border-radius:14px; border:2px dashed rgba(255,255,255,.28); display:grid; place-items:center; font:500 22px/1 var(--mono); letter-spacing:.14em; color:var(--faint)}
  .pred .vao{height:30px}
</style></head>
<body data-duracao="7000"><div class="slide">
  <div class="topo"><img class="fade" src="../../_base/assets/logo-branco.png" alt="ezeOS"><span class="handle fade" style="--d:100">@agenciaezeos</span></div>
  <div class="miolo">

    <h1 class="frase" data-palavras="200" data-passo="100">Ninguém pinta o andar de cima de um prédio que não tem chão<span class="pt">.</span></h1>
    <p class="lead in" style="--d:1500">E é isso que quase todo dono de negócio local paga pra fazer.</p>
    <div class="pred">
      <div class="balanca" style="--d:3200"><div class="bl sobe" style="--d:2000"><i></i><i></i><i></i><i></i></div></div>
      <div class="balanca" style="--d:3400"><div class="bl sobe" style="--d:2300"><i></i><i></i><i></i><i></i></div></div>
      <div class="vao"></div>
      <div class="chao pisca fade" style="--d:2700">TÉRREO</div>
    </div>
  </div>
  
</div>
<script src="../../_base/slides.js"></script>
</body></html>
