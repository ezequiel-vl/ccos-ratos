<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Manifesto · 04</title>
<link rel="stylesheet" href="slides.css">
<style>
  .miolo{gap:38px}
  .ficha{padding:40px 44px; display:grid; gap:26px}
  .cab{display:grid; gap:14px; padding-bottom:26px; border-bottom:1px solid var(--line)}
  .cab b{height:26px; width:46%; border-radius:9px; background:#2e2e2e}
  .cab s{height:14px; width:30%; border-radius:7px; background:var(--skel)}
  .checks{list-style:none; display:grid; gap:22px}
  .checks li{display:flex; align-items:center; gap:24px; font:400 36px/1.2 var(--ui); color:var(--ink)}
  .checks i{width:26px; height:26px; border-radius:50%; border:1.5px solid var(--dot-off); flex:none}
</style></head>
<body data-duracao="6500"><div class="slide">
  <div class="topo"><img class="fade" src="assets/logo-branco.png" alt="ezeOS"></div>
  <div class="miolo">

    <p class="titulo in" style="--d:200">Quem apareceu na sua frente provavelmente não posta mais do que você.</p>
    <p class="corpo in" style="--d:800">Abre a ficha dele e repara:</p>
    <div class="ficha card luz luz--anda in" style="--d:1100">
      <div class="cab"><b></b><s></s></div>
      <ul class="checks">
        <li class="in" style="--d:1500"><i class="acende" style="--d:1700"></i>site ligado no botão,</li>
        <li class="in" style="--d:1800"><i class="acende" style="--d:2000"></i>foto real do lugar,</li>
        <li class="in" style="--d:2100"><i class="acende" style="--d:2300"></i>serviço descrito,</li>
        <li class="in" style="--d:2400"><i class="acende" style="--d:2600"></i>horário certo,</li>
        <li class="in" style="--d:2700"><i class="acende" style="--d:2900"></i>avaliação respondida.</li>
      </ul>
    </div>
    <p class="titulo" data-palavras="3600" data-passo="90">O que ele tem a mais que você é endereço<span class="pt">.</span></p>

  </div>
  <div class="base"><span class="handle fade" style="--d:100">@agenciaezeos</span><div class="prog fade" style="--d:100"><i></i><i></i><i></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
</div>
<script src="slides.js"></script>
</body></html>
