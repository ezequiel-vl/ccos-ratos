<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Manifesto · 03</title>
<link rel="stylesheet" href="slides.css">
<style>
  .miolo{gap:34px}
  .frase{font-size:84px}
  .ex{font:400 27px/1.4 var(--ui); color:var(--faint)}
  .busca{display:flex; align-items:center; gap:20px; height:100px; padding:0 34px; border-radius:999px; font:400 36px/1 var(--ui); color:var(--ink)}
  .busca svg{width:30px; height:30px; fill:none; stroke:var(--mute); stroke-width:1.7; flex:none}
  .res{display:grid; gap:12px}
  .res div{display:grid; grid-template-columns:14px 1fr 120px; gap:22px; align-items:center; padding:18px 26px; border:1px solid var(--line); border-radius:14px; background:var(--sunk)}
  .res i{width:12px; height:12px; border-radius:50%; background:var(--dot-off)}
  .res b{height:16px; border-radius:8px; background:var(--skel)}
  .res s{height:30px; border-radius:999px; border:1px solid var(--line-2)}
</style></head>
<body data-duracao="7000"><div class="slide">
  <div class="topo"><img class="fade" src="assets/logo-branco.png" alt="ezeOS"></div>
  <div class="miolo">

    <h2 class="frase" data-palavras="200" data-passo="110">Não precisa acreditar em mim<span class="pt">.</span></h2>
    <p class="corpo in" style="--d:900">Pega o celular e busca o seu serviço mais caro junto com o nome do seu bairro.</p>
    <p class="ex in" style="--d:1200">Ex.: “harmonização facial centro”, “advogado trabalhista moinhos”, “pet shop zona sul”.</p>
    <div class="busca card luz luz--anda in" style="--d:1500"><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg><span data-digita="1900" data-passo="60" data-cursor>harmonização facial centro</span></div>
    <div class="res">
      <div class="in" style="--d:3700"><i></i><b style="width:62%"></b><s></s></div>
      <div class="in" style="--d:3850"><i></i><b style="width:48%"></b><s></s></div>
      <div class="in" style="--d:4000"><i></i><b style="width:70%"></b><s></s></div>
    </div>
    <p class="titulo ink" data-palavras="4500" data-passo="90">Agora olha quem apareceu<span class="pt">.</span></p>

  </div>
  <div class="base"><span class="handle fade" style="--d:100">@agenciaezeos</span><div class="prog fade" style="--d:100"><i></i><i></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
</div>
<script src="slides.js"></script>
</body></html>
