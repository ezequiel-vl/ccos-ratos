<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>08</title>
<link rel="stylesheet" href="../../_base/slides.css">
<style>
  .miolo{gap:40px}
  .et3{display:grid; gap:0}
  .et3 .r{display:grid; grid-template-columns:1fr auto; gap:20px; align-items:baseline; padding:30px 0; border-top:1px solid var(--line)}
  .et3 .r:last-child{border-bottom:1px solid var(--line)}
  .et3 .rotulo{font-size:24px; color:var(--mute); display:block; margin-bottom:12px}
  .et3 p{font:400 38px/1.25 var(--ui); color:var(--ink)}
  .et3 .prazo{font:500 26px/1 var(--mono); color:var(--ink); padding:12px 18px; border:1px solid var(--line-2); border-radius:999px}
</style></head>
<body data-duracao="6500"><div class="slide">
  <div class="topo"><img class="fade" src="../../_base/assets/logo-branco.png" alt="ezeOS"></div>
  <div class="miolo">

    <p class="lead in" style="--d:200">O Endereço Fixo, com prazo:</p>
    <div class="et3">
      <div class="r in" style="--d:700"><div><span class="rotulo">01 / Ponto</span><p>→ a empresa é encontrada</p></div><span class="prazo">10 dias</span></div>
      <div class="r in" style="--d:1200"><div><span class="rotulo">02 / Movimento</span><p>→ gente chega na porta</p></div></div>
      <div class="r in" style="--d:1700"><div><span class="rotulo">03 / Atendimento</span><p>→ quem chega é recebido na hora</p></div></div>
    </div>
    <p class="titulo" data-palavras="2500" data-passo="90" style="font-size:58px">As três etapas juntas ficam prontas em 6 semanas<span class="pt">.</span></p>
  </div>
  <div class="base"><span class="handle fade" style="--d:100">@agenciaezeos</span><div class="prog fade" style="--d:100"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i class="on"></i><i></i></div></div>
</div>
<script src="../../_base/slides.js"></script>
</body></html>
