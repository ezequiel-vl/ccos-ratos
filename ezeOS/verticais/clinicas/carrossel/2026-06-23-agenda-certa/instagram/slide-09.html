<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body style="margin:0;padding:0;width:1080px;height:1350px;overflow:hidden;background:#051836;position:relative;">

  <div style="position:absolute;inset:0;padding:80px 64px;box-sizing:border-box;display:flex;flex-direction:column;">

    <span style="font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;color:rgba(238,239,242,0.22);flex-shrink:0;">09</span>

    <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:48px;padding:36px 0;">

      <!-- Big number -->
      <div>
        <div style="font-family:'Bricolage Grotesque',sans-serif;font-size:160px;font-weight:800;line-height:0.85;color:#ef064a;letter-spacing:-0.03em;">30</div>
        <div style="font-family:'DM Sans',sans-serif;font-size:32px;font-weight:400;color:rgba(238,239,242,0.55);margin-top:8px;">dias</div>
      </div>

      <!-- Guarantee text -->
      <div style="display:flex;flex-direction:column;gap:20px;">
        <p style="margin:0;font-family:'DM Sans',sans-serif;font-size:30px;font-weight:400;line-height:1.55;color:#eeeff2;">Se nesse período sua clínica não receber pacientes qualificados pelo sistema — pacientes que chegam sabendo o procedimento, o valor e prontos pra agendar —</p>
        <p style="margin:0;font-family:'Bricolage Grotesque',sans-serif;font-size:36px;font-weight:800;line-height:1.2;color:#ffffff;">eu refaço a estratégia inteira sem cobrar nada.</p>
      </div>

      <!-- Hook -->
      <p style="margin:0;font-family:'DM Sans',sans-serif;font-size:28px;font-style:italic;color:rgba(238,239,242,0.45);line-height:1.4;">Mas se fizer sentido...</p>

    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;flex-shrink:0;">
      <span style="font-family:'DM Sans',sans-serif;font-size:17px;font-weight:500;color:rgba(255,255,255,0.2);letter-spacing:0.03em;">@agenciadominiolocal</span>
      <span style="font-family:'DM Sans',sans-serif;font-size:17px;font-weight:500;color:rgba(255,255,255,0.2);">9 / 10</span>
    </div>

  </div>

  <div style="position:absolute;bottom:0;left:0;width:90%;height:3px;background:#ffffff;"></div>

</body>
</html>
