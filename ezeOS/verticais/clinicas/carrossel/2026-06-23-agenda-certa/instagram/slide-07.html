<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body style="margin:0;padding:0;width:1080px;height:1350px;overflow:hidden;background:#051836;position:relative;">

  <div style="position:absolute;inset:0;padding:80px 64px;box-sizing:border-box;display:flex;flex-direction:column;">

    <span style="font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;color:rgba(238,239,242,0.22);flex-shrink:0;">07</span>

    <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:36px;padding:36px 0;">

      <!-- Menos/Mais contrasts -->
      <div style="display:flex;flex-direction:column;gap:20px;">
        <p style="margin:0;font-family:'DM Sans',sans-serif;font-size:32px;font-weight:400;line-height:1.45;color:#eeeff2;">
          <span style="color:rgba(238,239,242,0.35);">Menos conteúdo educativo,</span> mais conteúdo que vende.
        </p>
        <p style="margin:0;font-family:'DM Sans',sans-serif;font-size:32px;font-weight:400;line-height:1.45;color:#eeeff2;">
          <span style="color:rgba(238,239,242,0.35);">Menos seguidores curiosos,</span> mais pacientes qualificados.
        </p>
        <p style="margin:0;font-family:'DM Sans',sans-serif;font-size:32px;font-weight:400;line-height:1.45;color:#eeeff2;">
          <span style="color:rgba(238,239,242,0.35);">Menos volume de leads,</span> mais volume de agendamentos.
        </p>
      </div>

      <!-- Quote block -->
      <div style="background:rgba(239,6,74,0.08);border:1.5px solid rgba(239,6,74,0.25);border-radius:12px;padding:32px 36px;">
        <p style="margin:0;font-family:'DM Sans',sans-serif;font-size:30px;font-weight:400;font-style:italic;line-height:1.55;color:#eeeff2;">"A clínica que agenda sozinha não depende de vendedor. Depende de sistema."</p>
      </div>

      <!-- Hook -->
      <p style="margin:0;font-family:'Bricolage Grotesque',sans-serif;font-size:38px;font-weight:800;line-height:1.2;color:#ffffff;">E o sistema é simples:</p>

    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;flex-shrink:0;">
      <span style="font-family:'DM Sans',sans-serif;font-size:17px;font-weight:500;color:rgba(255,255,255,0.2);letter-spacing:0.03em;">@agenciadominiolocal</span>
      <span style="font-family:'DM Sans',sans-serif;font-size:17px;font-weight:500;color:rgba(255,255,255,0.2);">7 / 10</span>
    </div>

  </div>

  <div style="position:absolute;bottom:0;left:0;width:70%;height:3px;background:#ffffff;"></div>

</body>
</html>
