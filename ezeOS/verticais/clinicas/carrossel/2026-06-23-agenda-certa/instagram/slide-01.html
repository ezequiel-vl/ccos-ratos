<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
</head>
<body style="margin:0;padding:0;width:1080px;height:1350px;overflow:hidden;background:#051836;position:relative;">

  <div style="
    position:absolute;inset:0;
    padding:80px 64px;
    box-sizing:border-box;
    display:flex;
    flex-direction:column;
  ">

    <!-- Red accent bar (marca visual, não eyebrow) -->
    <div style="width:96px;height:3px;background:#ef064a;margin-bottom:auto;flex-shrink:0;"></div>

    <!-- Title block -->
    <div style="flex-shrink:0;padding-top:80px;">
      <div style="
        font-family:'Bricolage Grotesque',sans-serif;
        font-size:140px;
        font-weight:800;
        line-height:0.87;
        color:#ffffff;
        letter-spacing:-0.025em;
        margin-bottom:8px;
      ">AGENDA</div>
      <div style="
        font-family:'Bricolage Grotesque',sans-serif;
        font-size:140px;
        font-weight:800;
        line-height:0.87;
        color:#ef064a;
        letter-spacing:-0.025em;
      ">CERTA</div>

      <div style="width:64px;height:3px;background:#ef064a;margin:44px 0 36px;"></div>

      <div style="
        font-family:'DM Sans',sans-serif;
        font-size:35px;
        font-weight:400;
        line-height:1.5;
        color:#eeeff2;
      ">Sua clínica com agenda cheia<br>de pacientes de alto valor</div>
    </div>

    <!-- Spacer -->
    <div style="flex:1;min-height:80px;"></div>

    <!-- Sem lines -->
    <div style="flex-shrink:0;margin-bottom:52px;display:flex;flex-direction:column;gap:20px;">
      <div style="display:flex;align-items:center;gap:16px;">
        <span style="width:7px;height:7px;border-radius:50%;background:#ef064a;flex-shrink:0;"></span>
        <span style="font-family:'DM Sans',sans-serif;font-size:28px;font-weight:400;color:rgba(238,239,242,0.45);">Sem WhatsApp frio</span>
      </div>
      <div style="display:flex;align-items:center;gap:16px;">
        <span style="width:7px;height:7px;border-radius:50%;background:#ef064a;flex-shrink:0;"></span>
        <span style="font-family:'DM Sans',sans-serif;font-size:28px;font-weight:400;color:rgba(238,239,242,0.45);">Sem recepcionista vendendo</span>
      </div>
      <div style="display:flex;align-items:center;gap:16px;">
        <span style="width:7px;height:7px;border-radius:50%;background:#ef064a;flex-shrink:0;"></span>
        <span style="font-family:'DM Sans',sans-serif;font-size:28px;font-weight:400;color:rgba(238,239,242,0.45);">Sem lead perdido</span>
      </div>
    </div>

    <!-- Branding -->
    <div style="flex-shrink:0;display:flex;justify-content:space-between;align-items:center;">
      <span style="font-family:'DM Sans',sans-serif;font-size:17px;font-weight:500;color:rgba(255,255,255,0.2);letter-spacing:0.03em;">@agenciadominiolocal</span>
      <span style="font-family:'DM Sans',sans-serif;font-size:17px;font-weight:500;color:rgba(255,255,255,0.2);">1 / 10</span>
    </div>

  </div>

  <!-- Progress bar 1/10 -->
  <div style="position:absolute;bottom:0;left:0;width:10%;height:3px;background:#ffffff;"></div>

</body>
</html>
